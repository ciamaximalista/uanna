plugins {
    id "com.android.application"
}

def customBuildDir = System.getenv("UANNA_ANDROID_BUILD_DIR")
if (customBuildDir != null && customBuildDir.trim() != "") {
    layout.buildDirectory = file(customBuildDir)
}

android {
    namespace "com.ciamaximalista.uanna"
    compileSdk 35

    signingConfigs {
        debug {
            def customKeystore = System.getenv("UANNA_ANDROID_KEYSTORE")
            if (customKeystore != null && customKeystore.trim() != "") {
                storeFile file(customKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.ciamaximalista.uanna"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
